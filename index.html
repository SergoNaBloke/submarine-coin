<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Submarine Coins</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell" aria-label="Submarine coin game">
    <canvas id="game" aria-label="Game canvas"></canvas>

    <div class="hud" aria-live="polite">
      <section class="hud-card score-card" aria-label="Coins collected">
        <div class="coin-icon" aria-hidden="true"></div>
        <div>
          <span id="coinCount">00</span>
          <small>COINS</small>
        </div>
      </section>
      <section class="hud-card lives-card" aria-label="Lives remaining">
        <small>HULL INTEGRITY</small>
        <div id="lives" class="lives" role="img" aria-label="3 of 3 lives remaining"></div>
      </section>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="panel">
        <h1>GAME OVER</h1>
        <p>Coins: <strong id="finalScore">0</strong></p>
        <button id="restartButton" class="restart-button" type="button">PLAY AGAIN</button>
        <p class="hint">Tap the button or press Space / W / ↑</p>
      </div>
    </div>

    <div id="startHint" class="start-hint">Hold Space / W / ↑ or touch the screen to rise</div>
  </main>

  <script src="game-core.js"></script>
  <script src="game.js"></script>
</body>
</html>
